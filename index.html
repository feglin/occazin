<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Occaz'In – comparez les annonces par produit</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a href="#/" class="logo">Occaz<span>'In</span></a>
  <form id="searchForm" class="search" autocomplete="off">
    <input id="q" type="search" placeholder="Nom du produit ou code-barres (EAN)…" aria-label="Recherche">
    <button type="submit">Rechercher</button>
  </form>
  <button id="sellBtn" class="cta" type="button">+ Déposer une annonce</button>
</header>

<main id="view"></main>

<dialog id="sellDialog">
  <form id="sellForm" method="dialog">
    <h2>Déposer une annonce</h2>
    <label>Code-barres (EAN-13)
      <div class="row">
        <input name="ean" id="sellEan" inputmode="numeric" maxlength="13" placeholder="ex : 3017620422003" required>
        <button type="button" id="lookupBtn" class="ghost">Chercher</button>
      </div>
    </label>
    <p id="productHint" class="hint">Saisissez le code-barres : le produit sera rattaché automatiquement.</p>
    <div id="newProduct" hidden>
      <label>Nom du produit <input name="pname" placeholder="Marque + modèle"></label>
      <label>Catégorie
        <select name="pcat"></select>
      </label>
    </div>
    <div class="grid2">
      <label>Prix (€) <input name="price" type="number" min="0" step="0.01" required></label>
      <label>État
        <select name="cond" required></select>
      </label>
    </div>
    <div class="grid2">
      <label>Ville <input name="city" list="cities" required></label>
      <label>Pseudo <input name="seller" required></label>
    </div>
    <datalist id="cities"></datalist>
    <label>Description <textarea name="desc" rows="3" maxlength="400"></textarea></label>
    <div class="actions">
      <button type="button" id="cancelSell" class="ghost">Annuler</button>
      <button type="submit" class="cta">Publier</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
